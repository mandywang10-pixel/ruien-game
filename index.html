<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>👸 芮恩公主 12歲生日大冒險</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #87CEEB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    #hud {
      background: #ffffff;
      padding: 8px 12px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      z-index: 10;
      flex-shrink: 0;
      position: relative;
    }
    #hud h1 {
      margin: 0;
      font-size: 16px;
      color: #d63384;
      padding-right: 44px;
    }
    #stats {
      margin-top: 4px;
      font-size: 15px;
      font-weight: bold;
      color: #222222;
      display: flex;
      justify-content: center;
      gap: 22px;
    }
    #sound-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #d63384;
      background: #fff0f6;
      color: #d63384;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #game-container {
      flex: 1;
      position: relative;
      width: 100%;
      min-height: 240px;
      overflow: hidden;
      background: #87CEEB;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #controls {
      background: #1e293b;
      padding: 14px 14px 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      z-index: 10;
    }
    .btn-group {
      display: flex;
      gap: 12px;
    }
    /* 超大按鍵設計 */
    .ctrl-btn {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      font-size: 32px;
      font-weight: bold;
      color: #ffffff;
      background: #2563eb;
      box-shadow: 0 5px 0 #1e3a8a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .ctrl-btn.active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #1e3a8a;
      background: #1d4ed8;
    }
    #btn-magic {
      background: #9333ea;
      box-shadow: 0 5px 0 #581c87;
    }
    #btn-magic.active {
      background: #7e22ce;
      box-shadow: 0 1px 0 #581c87;
    }
    #btn-jump {
      background: #dc2626;
      box-shadow: 0 5px 0 #7f1d1d;
    }
    #btn-jump.active {
      background: #b91c1c;
      box-shadow: 0 1px 0 #7f1d1d;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 24px;
      z-index: 20;
    }
    #overlay h2 {
      font-size: 28px;
      margin: 0 0 10px;
      color: #ffd700;
    }
    #overlay p {
      font-size: 18px;
      margin: 0 0 22px;
      line-height: 1.5;
    }
    #restart-btn {
      padding: 14px 32px;
      font-size: 19px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      background: #ff69b4;
      color: #ffffff;
      box-shadow: 0 4px 0 #9d174d;
    }
  </style>
</head>
<body>

  <div id="hud">
    <h1>👸 芮恩公主 12歲生日大冒險 👸</h1>
    <button id="sound-btn" aria-label="切換聲音">🔊</button>
    <div id="stats">
      <span id="lives-display">❤️❤️❤️</span>
      <span id="stars-display">⭐ 0 / 10</span>
    </div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">🎂 生日快樂！</h2>
      <p id="overlay-msg">恭喜芮恩公主收集星星抵達城堡！</p>
      <button id="restart-btn" onclick="resetGame()">再玩一次 🎉</button>
    </div>
  </div>

  <div id="controls">
    <div class="btn-group">
      <button class="ctrl-btn" id="btn-left" aria-label="向左移動">◀</button>
      <button class="ctrl-btn" id="btn-right" aria-label="向右移動">▶</button>
    </div>
    <div class="btn-group">
      <button class="ctrl-btn" id="btn-magic" aria-label="魔法攻擊">✨</button>
      <button class="ctrl-btn" id="btn-jump" aria-label="跳躍">⬆</button>
    </div>
  </div>

<script>

function ensureAudio() {
  try {
    if (!AudioCtx) return;
    if (!audioCtx) {
      audioCtx = new AudioCtx();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  } catch (e) {}
}
