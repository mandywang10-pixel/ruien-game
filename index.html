<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>芮恩公主生日大冒險</title>

<style>
body{
    margin:0;
    font-family:Arial;
    text-align:center;
    background:linear-gradient(#87ceeb,#ffe4f2);
    overflow:hidden;
}

h1{
    color:#ff4fa3;
}

#game{
    width:100%;
    height:70vh;
    position:relative;
    background:#9ee7ff;
    overflow:hidden;
    border-top:5px solid white;
    border-bottom:5px solid white;
}

#ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:80px;
    background:#7cc76f;
}

#player{
    position:absolute;
    bottom:80px;
    left:50px;
    font-size:50px;
}

.star{
    position:absolute;
    font-size:30px;
}

#castle{
    display:none;
    position:absolute;
    right:30px;
    bottom:80px;
    font-size:100px;
}

#cake{
    display:none;
    position:absolute;
    right:120px;
    bottom:120px;
    font-size:80px;
}

#message{
    display:none;
    position:absolute;
    top:30%;
    width:100%;
    color:#ff1493;
    font-size:32px;
    font-weight:bold;
}

button{
    font-size:20px;
    padding:10px 20px;
    margin:5px;
}
</style>
</head>

<body>

<h1>👸 芮恩公主 12歲生日大冒險 👸</h1>

<div>
收集星星：<span id="score">0</span>/10
</div>

<div id="game">

<div id="player">👸</div>

<div id="castle">🏰</div>

<div id="cake">
