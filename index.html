<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>👸 芮恩公主 12歲生日大冒險</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #87CEEB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    #hud {
      background: #ffffff;
      padding: 8px 12px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      z-index: 10;
      flex-shrink: 0;
      position: relative;
    }
    #hud h1 {
      margin: 0;
      font-size: 16px;
      color: #d63384;
      padding-right: 44px;
    }
    #stats {
      margin-top: 4px;
      font-size: 15px;
      font-weight: bold;
      color: #222222;
      display: flex;
      justify-content: center;
      gap: 22px;
    }
    #sound-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #d63384;
      background: #fff0f6;
      color: #d63384;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #game-container {
      flex: 1;
      position: relative;
      width: 100%;
      min-height: 240px;
      overflow: hidden;
      background: #87CEEB;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #controls {
      background: #1e293b;
      padding: 14px 14px 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      z-index: 10;
    }
    .btn-group {
      display: flex;
      gap: 12px;
    }
    .ctrl-btn {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      font-size: 32px;
      font-weight: bold;
      color: #ffffff;
      background: #2563eb;
      box-shadow: 0 5px 0 #1e3a8a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .ctrl-btn.active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #1e3a8a;
      background: #1d4ed8;
    }
    #btn-magic {
      background: #9333ea;
      box-shadow: 0 5px 0 #581c87;
    }
    #btn-magic.active {
      background: #7e22ce;
      box-shadow: 0 1px 0 #581c87;
    }
    #btn-jump {
      background: #dc2626;
      box-shadow: 0 5px 0 #7f1d1d;
    }
    #btn-jump.active {
      background: #b91c1c;
      box-shadow: 0 1px 0 #7f1d1d;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 24px;
      z-index: 20;
    }
    #overlay h2 {
      font-size: 28px;
      margin: 0 0 10px;
      color: #ffd700;
    }
    #overlay p {
      font-size: 18px;
      margin: 0 0 22px;
      line-height: 1.5;
    }
    #restart-btn {
      padding: 14px 32px;
      font-size: 19px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      background: #ff69b4;
      color: #ffffff;
      box-shadow: 0 4px 0 #9d174d;
    }
  </style>
</head>
<body>

  <div id="hud">
    <h1>👸 芮恩公主 12歲生日大冒險 👸</h1>
    <button id="sound-btn" aria-label="切換聲音">🔊</button>
    <div id="stats">
      <span id="lives-display">❤️❤️❤️</span>
      <span id="stars-display">⭐ 0 / 10</span>
    </div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">🎂 生日快樂！</h2>
      <p id="overlay-msg">恭喜芮恩公主收集星星抵達城堡！</p>
      <button id="restart-btn" onclick="resetGame()">再玩一次 🎉</button>
    </div>
  </div>

  <div id="controls">
    <div class="btn-group">
      <button class="ctrl-btn" id="btn-left" aria-label="向左移動">◀</button>
      <button class="ctrl-btn" id="btn-right" aria-label="向右移動">▶</button>
    </div>
    <div class="btn-group">
      <button class="ctrl-btn" id="btn-magic" aria-label="魔法攻擊">✨</button>
      <button class="ctrl-btn" id="btn-jump" aria-label="跳躍">⬆</button>
    </div>
  </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let viewW = 360;
let viewH = 420;

function syncSize() {
  const box = document.getElementById("game-container");
  const w = box ? box.clientWidth : 0;
  const h = box ? box.clientHeight : 0;
  viewW = w > 50 ? w : window.innerWidth || 360;
  viewH = h > 50 ? h : Math.max(260, (window.innerHeight || 600) - 190);
  if (canvas.width !== viewW || canvas.height !== viewH) {
    canvas.width = viewW;
    canvas.height = viewH;
  }
}

window.addEventListener("resize", syncSize);

// ================= 音效系統 =================
let audioCtx = null;
let soundEnabled = true;
let bgmTimer = null;
let bgmStep = 0;
let bgmMode = "adventure";
let audioUnlocked = false;

const adventureNotes = [523, 659, 784, 659, 587, 784, 880, 784, 659, 784, 1046, 784, 698, 880, 784, 659];
const winNotes = [523, 659, 784, 1046, 784, 1046, 1175, 1319, 1046, 784, 659, 784, 1046, 0, 1046, 0];

function unlockAudio() {
  if (!soundEnabled) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === "suspended") audioCtx.resume();
    if (!audioUnlocked) {
      audioUnlocked = true;
      startBGM(gameWon ? "win" : "adventure");
    }
  } catch (err) {}
}

function tone(freq, dur, type, vol, delay) {
  if (!soundEnabled || !audioCtx || !freq) return;
  try {
    const t = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || "triangle";
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.001, t);
    gain.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  } catch (err) {}
}

function stopBGM() {
  if (bgmTimer) {
    clearInterval(bgmTimer);
    bgmTimer = null;
  }
}

function startBGM(mode) {
  stopBGM();
  bgmMode = mode || "adventure";
  bgmStep = 0;
  if (!soundEnabled || !audioCtx) return;
  const interval = bgmMode === "win" ? 190 : 210;
  bgmTimer = setInterval(function () {
    if (!soundEnabled || !audioCtx || audioCtx.state !== "running") return;
    const list = bgmMode === "win" ? winNotes : adventureNotes;
    const f = list[bgmStep % list.length];
    if (f > 0) tone(f, 0.15, bgmMode === "win" ? "sine" : "triangle", 0.06, 0);
    bgmStep++;
  }, interval);
}

function playStarSound() {
  unlockAudio();
  tone(988, 0.09, "sine", 0.15, 0);
  tone(1319, 0.18, "sine", 0.15, 0.08);
}

function playMagicSound() {
  unlockAudio();
  if (!soundEnabled || !audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, t);
    osc.frequency.exponentialRampToValueAtTime(1560, t + 0.12);
    gain.gain.setValueAtTime(0.14, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.15);
  } catch (err) {}
}

function playHurtSound() {
  unlockAudio();
  tone(311, 0.14, "sawtooth", 0.13, 0);
  tone(220, 0.16, "sawtooth", 0.13, 0.11);
  tone(147, 0.24, "sawtooth", 0.13, 0.22);
}

function playWinMusic() {
  unlockAudio();
  startBGM("win");
}

document.getElementById("sound-btn").addEventListener("click", function () {
  soundEnabled = !soundEnabled;
  document.getElementById("sound-btn").textContent = soundEnabled ? "🔊" : "🔇";
  if (soundEnabled) {
    audioUnlocked = false;
    unlockAudio();
  } else {
    stopBGM();
  }
});

// ================= 遊戲邏輯 =================
const WORLD_WIDTH = 2600;
let cameraX = 0;
let gameOver = false;
let gameWon = false;
const touchState = { left: false, right: false };

let player, blocks, stars, monsters, magics, fireworks, castle;

function getGroundY() {
  return viewH - 50;
}

function resetGame() {
  syncSize();
  const groundY = getGroundY();

  document.getElementById("overlay").style.display = "none";
  gameOver = false;
  gameWon = false;
  cameraX = 0;

  player = {
    x: 60,
    y: groundY - 44,
    w: 40,
    h: 44,
    vx: 0,
    vy: 0,
    speed: 4.8,
    jumpPower: -13,
    grounded: false,
    facing: 1,
    lives: 3,
    stars: 0,
    invincible: 0
  };

  blocks = [
    { x: 220, y: groundY - 120, w: 44, h: 44, hit: false },
    { x: 450, y: groundY - 130, w: 44, h: 44, hit: false },
    { x: 740, y: groundY - 120, w: 44, h: 44, hit: false },
    { x: 1040, y: groundY - 135, w: 44, h: 44, hit: false },
    { x: 1380, y: groundY - 120, w: 44, h: 44, hit: false },
    { x: 1780, y: groundY - 130, w: 44, h: 44, hit: false }
  ];

  stars = [
    { x: 340, y: groundY - 42, collected: false },
    { x: 610, y: groundY - 100, collected: false },
    { x: 1210, y: groundY - 42, collected: false },
    { x: 1610, y: groundY - 100, collected: false }
  ];

  monsters = [
    { x: 420, y: groundY - 38, w: 38, h: 38, vx: -1.5, minX: 320, maxX: 550, alive: true },
    { x: 900, y: groundY - 38, w: 38, h: 38, vx: -1.8, minX: 780, maxX: 1020, alive: true },
    { x: 1320, y: groundY - 38, w: 38, h: 38, vx: -2.0, minX: 1180, maxX: 1480, alive: true },
    { x: 1720, y: groundY - 38, w: 38, h: 38, vx: -2.2, minX: 1580, maxX: 1920, alive: true }
  ];

  magics = [];
  fireworks = [];
  castle = { x: 2220, y: groundY - 140, w: 130, h: 140 };

  updateHUD();
  if (audioUnlocked && soundEnabled) startBGM("adventure");
}

function updateHUD() {
  document.getElementById("lives-display").textContent = "❤️".repeat(Math.max(0, player.lives)) || "💔";
  document.getElementById("stars-display").textContent = "⭐ " + player.stars + " / 10";
}

function doJump() {
  unlockAudio();
  if (gameOver || gameWon) return;
  if (player.grounded) {
    player.vy = player.jumpPower;
    player.grounded = false;
  }
}

function doMagic() {
  unlockAudio();
  if (gameOver || gameWon) return;
  playMagicSound();
  magics.push({
    x: player.facing === 1 ? player.x + player.w : player.x - 16,
    y: player.y + 18,
    vx: player.facing * 8.5,
    life: 65
  });
}

function bindHold(id, dir) {
  const el = document.getElementById(id);
  function onDown(e) {
    if (e.cancelable) e.preventDefault();
    unlockAudio();
    touchState[dir] = true;
    el.classList.add("active");
  }
  function onUp(e) {
    if (e.cancelable) e.preventDefault();
    touchState[dir] = false;
    el.classList.remove("active");
  }
  el.addEventListener("touchstart", onDown, { passive: false });
  el.addEventListener("touchend", onUp, { passive: false });
  el.addEventListener("touchcancel", onUp, { passive: false });
  el.addEventListener("mousedown", onDown);
  el.addEventListener("mouseup", onUp);
  el.addEventListener("mouseleave", onUp);
}

function bindTap(id, fn) {
  const el = document.getElementById(id);
  function onPress(e) {
    if (e.cancelable) e.preventDefault();
    el.classList.add("active");
    fn();
  }
  function onRelease(e) {
    if (e.cancelable) e.preventDefault();
    el.classList.remove("active");
  }
  el.addEventListener("touchstart", onPress, { passive: false });
  el.addEventListener("touchend", onRelease, { passive: false });
  el.addEventListener("touchcancel", onRelease, { passive: false });
  el.addEventListener("mousedown", onPress);
  el.addEventListener("mouseup", onRelease);
}

bindHold("btn-left", "left");
bindHold("btn-right", "right");
bindTap("btn-jump", doJump);
bindTap("btn-magic", doMagic);

function spawnFirework(x, y) {
  const palette = ["#ff4757", "#ffa502", "#2ed573", "#1e90ff", "#ff6b81", "#ffd700"];
  for (let i = 0; i < 28; i++) {
    const ang = (Math.PI * 2 * i) / 28;
    const spd = 2 + Math.random() * 4;
    fireworks.push({
      x: x,
      y: y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      color: palette[Math.floor(Math.random() * palette.length)],
      alpha: 1
    });
  }
}

function update() {
  syncSize();
  const groundY = getGroundY();

  if (gameWon) {
    if (Math.random() < 0.08) {
      spawnFirework(cameraX + 70 + Math.random() * Math.max(120, viewW - 140), 60 + Math.random() * 150);
    }
    fireworks.forEach(function (p) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.06;
      p.alpha -= 0.015;
    });
    fireworks = fireworks.filter(function (p) { return p.alpha > 0; });
    return;
  }

  if (gameOver) return;

  if (touchState.left) {
    player.vx = -player.speed;
    player.facing = -1;
  } else if (touchState.right) {
    player.vx = player.speed;
    player.facing = 1;
  } else {
    player.vx = 0;
  }

  player.x += player.vx;
  if (player.x < 0) player.x = 0;
  if (player.x > WORLD_WIDTH - player.w) player.x = WORLD_WIDTH - player.w;

  player.vy += 0.6;
  player.y += player.vy;

  if (player.y + player.h >= groundY) {
    player.y = groundY - player.h;
    player.vy = 0;
    player.grounded = true;
  }

  blocks.forEach(function (b) {
    if (
      player.x + player.w > b.x &&
      player.x < b.x + b.w &&
      player.y <= b.y + b.h &&
      player.y >= b.y &&
      player.vy < 0
    ) {
      player.vy = 2;
      if (!b.hit) {
        b.hit = true;
        stars.push({ x: b.x + 7, y: b.y - 38, collected: false });
      }
    }
  });

  stars.forEach(function (s) {
    if (!s.collected &&
        player.x < s.x + 32 &&
        player.x + player.w > s.x &&
        player.y < s.y + 32 &&
        player.y + player.h > s.y) {
      s.collected = true;
      player.stars++;
      playStarSound();
      updateHUD();
    }
  });

  magics.forEach(function (m) {
    m.x += m.vx;
    m.life--;
    monsters.forEach(function (mon) {
      if (mon.alive &&
          m.x > mon.x && m.x < mon.x + mon.w &&
          m.y > mon.y && m.y < mon.y + mon.h) {
        mon.alive = false;
        m.life = 0;
      }
    });
  });
  magics = magics
