<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>👸 芮恩公主 12歲生日大冒險</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #87CEEB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    #hud {
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 12px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      z-index: 10;
      flex-shrink: 0;
      position: relative;
    }
    #hud h1 {
      margin: 0;
      font-size: 16px;
      color: #d63384;
      padding-right: 42px;
    }
    #stats {
      margin-top: 4px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    #sound-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #d63384;
      background: #fff0f6;
      color: #d63384;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #game-container {
      flex: 1;
      position: relative;
      width: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #controls {
      background: #22303c;
      padding: 14px 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
    }
    .btn-group {
      display: flex;
      gap: 14px;
    }
    .ctrl-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      font-size: 26px;
      font-weight: bold;
      color: #ffffff;
      background: #3498db;
      box-shadow: 0 4px 0 #1b4f72;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .ctrl-btn.active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1b4f72;
      background: #2874a6;
    }
    #btn-magic {
      background: #9b59b6;
      box-shadow: 0 4px 0 #5b2c6f;
    }
    #btn-magic.active {
      background: #7d3c98;
      box-shadow: 0 1px 0 #5b2c6f;
    }
    #btn-jump {
      background: #e74c3c;
      box-shadow: 0 4px 0 #78281f;
    }
    #btn-jump.active {
      background: #cb4335;
      box-shadow: 0 1px 0 #78281f;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 24px;
      z-index: 20;
    }
    #overlay h2 {
      font-size: 28px;
      margin: 0 0 10px;
      color: #ffd700;
    }
    #overlay p {
      font-size: 18px;
      margin: 0 0 22px;
      line-height: 1.5;
    }
    #restart-btn {
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      background: #ff69b4;
      color: #ffffff;
      box-shadow: 0 4px 0 #b0306d;
    }
  </style>
</head>
<body>

  <div id="hud">
    <h1>👸 芮恩公主 12歲生日大冒險 👸</h1>
    <button id="sound-btn" aria-label="切換聲音">🔊</button>
    <div id="stats">
      <span id="lives-display">❤️❤️❤️</span>
      <span id="stars-display">⭐ 0 / 10</span>
    </div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">🎂 生日快樂！</h2>
      <p id="overlay-msg">恭喜芮恩公主收集星星抵達城堡！</p>
      <button id="restart-btn" onclick="resetGame()">再玩一次 🎉</button>
    </div>
  </div>

  <div id="controls">
    <div class="btn-group">
      <button class="ctrl-btn" id="btn-left" aria-label="向左移動">◀</button>
      <button class="ctrl-btn" id="btn-right" aria-label="向右移動">▶</button>
    </div>
    <div class="btn-group">
      <button class="ctrl-btn" id="btn-magic" aria-label="魔法攻擊">✨</button>
      <button class="ctrl-btn" id="btn-jump" aria-label="跳躍">⬆</button>
    </div>
  </div>

<script>
// ================= 音效與背景音樂系統 =================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let soundEnabled = true;
let bgmTimer = null;
let bgmStep = 0;
let bgmMode = "adventure"; // "adventure" | "win" | "none"

// 活潑冒險主旋律（頻率 Hz，0 代表休止）
const adventureMelody = [
  523.25, 659.25, 783.99, 659.25,
  587.33, 783.99, 880.00, 783.99,
  659.25, 783.99, 1046.50, 783.99,
  698.46, 880.00, 783.99, 659.25
];

// 破關歡快慶祝旋律
const winMelody = [
  523.25, 659.25, 783.99, 1046.50,
  783.99, 1046.50, 1174.66, 1318.51,
  1046.50, 783.99, 659.25, 783.99,
  1046.50, 0, 1046.50, 0
];

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new AudioCtx();
  }
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

function playTone(freq, duration, type = "triangle", volume = 0.12, delay = 0) {
  if (!soundEnabled || !audioCtx || freq <= 0) return;
  const now = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(volume, now + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + duration + 0.02);
}

function startBGM(mode = "adventure") {
  stopBGM();
  bgmMode = mode;
  bgmStep = 0;
  if (!soundEnabled || mode === "none") return;

  const tempoMs = mode === "win" ? 190 : 210;
  bgmTimer = setInterval(() => {
    if (!soundEnabled || !audioCtx || audioCtx.state !== "running") return;
    const notes = bgmMode === "win" ? winMelody : adventureMelody;
    const freq = notes[bgmStep % notes.length];
    if (freq > 0) {
      playTone(freq, 0.16, bgmMode === "win" ? "sine" : "triangle", 0.065, 0);
    }
    bgmStep++;
  }, tempoMs);
}

function stopBGM() {
  if (bgmTimer) {
    clearInterval(bgmTimer);
    bgmTimer = null;
  }
}

// 1. 吃到星星音效
function sfxStar() {
  ensureAudio();
  playTone(987.77, 0.09, "sine", 0.16, 0);
  playTone(1318.51, 0.18, "sine", 0.16, 0.08);
}

// 2. 射擊魔法音效
function sfxMagic() {
  ensureAudio();
  if (!soundEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(880, now);
  osc.frequency.exponentialRampToValueAtTime(1560, now + 0.12);
  gain.gain.setValueAtTime(0.14, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.15);
}

// 3. 被怪物攻擊音效
function sfxHurt() {
  ensureAudio();
  playTone(311.13, 0.14, "sawtooth", 0.14, 0);
  playTone(220.00, 0.16, "sawtooth", 0.14, 0.11);
  playTone(146.83, 0.25, "sawtooth", 0.14, 0.22);
}

// 4. 破關音樂
function sfxWin() {
  ensureAudio();
  startBGM("win");
}

document.getElementById("sound-btn").addEventListener("touchstart", (e) => {
  e.preventDefault();
  soundEnabled = !soundEnabled;
  document.getElementById("sound-btn").textContent = soundEnabled ? "🔊" : "🔇";
  if (soundEnabled) {
    ensureAudio();
    if (!gameOver) {
      startBGM(gameWon ? "win" : "adventure");
    }
  } else {
    stopBGM();
  }
}, { passive: false });

// ================= 遊戲主程式 =================
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  const container = document.getElementById("game-container");
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

const WORLD_WIDTH = 2600;
let cameraX = 0;
let gameOver = false;
let gameWon = false;
let hasStartedAudio = false;

const touchState = { left: false, right: false };
let player, blocks, stars, monsters, magics, fireworks, castle;

function triggerInitialMusic() {
  if (!hasStartedAudio) {
    hasStartedAudio = true;
    ensureAudio();
    startBGM("adventure");
  }
}

function resetGame() {
  document.getElementById("overlay").style.display = "none";
  gameOver = false;
  gameWon = false;
  cameraX = 0;

  if (hasStartedAudio && soundEnabled) {
    ensureAudio();
    startBGM("adventure");
  }

  const groundY = canvas.height - 50;

  player = {
    x: 60,
    y: groundY - 45,
    w: 40,
    h: 45,
    vx: 0,
    vy: 0,
    speed: 4.5,
    jumpPower: -12.5,
    grounded: false,
    facing: 1,
    lives: 3,
    stars: 0,
    invincible: 0
  };

  blocks = [
    { x: 240, y: groundY - 130, w: 42, h: 42, hit: false },
    { x: 460, y: groundY - 140, w: 42, h: 42, hit: false },
    { x: 750, y: groundY - 130, w: 42, h: 42, hit: false },
    { x: 1050, y: groundY - 150, w: 42, h: 42, hit: false },
    { x: 1400, y: groundY - 130, w: 42, h: 42, hit: false },
    { x: 1800, y: groundY - 140, w: 42, h: 42, hit: false }
  ];

  stars = [
    { x: 350, y: groundY - 45, collected: false },
    { x: 620, y: groundY - 110, collected: false },
    { x: 1220, y: groundY - 45, collected: false },
    { x: 1620, y: groundY - 110, collected: false }
  ];

  monsters = [
    { x: 420, y: groundY - 38, w: 38, h: 38, vx: -1.5, minX: 320, maxX: 550, alive: true },
    { x: 900, y: groundY - 38, w: 38, h: 38, vx: -1.8, minX: 780, maxX: 1020, alive: true },
    { x: 1320, y: groundY - 38, w: 38, h: 38, vx: -2.0, minX: 1180, maxX: 1480, alive: true },
    { x: 1720, y: groundY - 38, w: 38, h: 38, vx: -2.2, minX: 1580, maxX: 1920, alive: true }
  ];

  magics = [];
  fireworks = [];

  castle = {
    x: 2220,
    y: groundY - 140,
    w: 130,
    h: 140
  };

  updateHUD();
}

function updateHUD() {
  document.getElementById("lives-display").textContent = "❤️".repeat(Math.max(0, player.lives)) || "💔";
  document.getElementById("stars-display").textContent = `⭐ ${player.stars} / 10`;
}

function jump() {
  triggerInitialMusic();
  if (gameOver || gameWon) return;
  if (player.grounded) {
    player.vy = player.jumpPower;
    player.grounded = false;
  }
}

function shootMagic() {
  triggerInitialMusic();
  if (gameOver || gameWon) return;
  sfxMagic();
  magics.push({
    x: player.facing === 1 ? player.x + player.w : player.x - 16,
    y: player.y + 18,
    vx: player.facing * 8,
    life: 60
  });
}

function bindTouchHold(id, dirKey) {
  const btn = document.getElementById(id);
  btn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    triggerInitialMusic();
    touchState[dirKey] = true;
    btn.classList.add("active");
  }, { passive: false });

  const release = (e) => {
    e.preventDefault();
    touchState[dirKey] = false;
    btn.classList.remove("active");
  };

  btn.addEventListener("touchend", release, { passive: false });
  btn.addEventListener("touchcancel", release, { passive: false });
}

function bindTouchTap(id, action) {
  const btn = document.getElementById(id);
  btn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    btn.classList.add("active");
    action();
  }, { passive: false });

  const release = (e) => {
    e.preventDefault();
    btn.classList.remove("active");
  };

  btn.addEventListener("touchend", release, { passive: false });
  btn.addEventListener("touchcancel", release, { passive: false });
}

bindTouchHold("btn-left", "left");
bindTouchHold("btn-right", "right");
bindTouchTap("btn-jump", jump);
bindTouchTap("btn-magic", shootMagic);

function spawnFirework(x, y) {
  const colors = ["#ff4757", "#ffa502", "#2ed573", "#1e90ff", "#ff6b81", "#ffd700"];
  for (let i = 0; i < 28; i++) {
    const angle = (Math.PI * 2 * i) / 28;
    const speed = 2 + Math.random() * 4;
    fireworks.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 1
    });
  }
}

function update() {
  const groundY = canvas.height - 50;

  if (gameWon) {
    if (Math.random() < 0.08) {
      spawnFirework(cameraX + 80 + Math.random() * (canvas.width - 160), 60 + Math.random() * 180);
    }
    fireworks.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.06;
      p.alpha -= 0.015;
    });
    fireworks = fireworks.filter(p => p.alpha > 0);
    return;
  }

  if (gameOver) return;

  if (touchState.left) {
    player.vx = -player.speed;
    player.facing = -1;
  } else if (touchState.right) {
    player.vx = player.speed;
    player.facing = 1;
  } else {
    player.vx = 0;
  }

  player.x += player.vx;
  if (player.x < 0) player.x = 0;
  if (player.x > WORLD_WIDTH - player.w) player.x = WORLD_WIDTH - player.w;

  player.vy += 0.6;
  player.y += player.vy;

  if (player.y + player.h >= groundY) {
    player.y = groundY - player.h;
    player.vy = 0;
    player.grounded = true;
  }

  blocks.forEach(b => {
    if (
      player.x + player.w > b.x &&
      player.x < b.x + b.w &&
      player.y <= b.y + b.h &&
      player.y >= b.y &&
      player.vy < 0
    ) {
      player.vy = 2;
      if (!b.hit) {
        b.hit = true;
        stars.push({ x: b.x + 6, y: b.y - 38, collected: false });
      }
    }
  });

  stars.forEach(s => {
    if (!s.collected &&
        player.x < s.x + 30 &&
        player.x + player.w > s.x &&
        player.y < s.y + 30 &&
        player.y + player.h > s.y) {
      s.collected = true;
      player.stars++;
      sfxStar();
      updateHUD();
    }
  });

  magics.forEach(m => {
    m.x += m.vx;
    m.life--;
    monsters.forEach(mon => {
      if (mon.alive &&
          m.x > mon.x && m.x < mon.x + mon.w &&
          m.y > mon.y && m.y < mon.y + mon.h) {
        mon.alive = false;
        m.life = 0;
      }
    });
  });
  magics = magics.filter(m => m.life > 0);

  if (player.invincible > 0) player.invincible--;

  monsters.forEach(mon => {
    if (!mon.alive) return;
    mon.x += mon.vx;
    if (mon.x <= mon.minX || mon.x >= mon.maxX) mon.vx *= -1;

    if (player.x + player.w - 6 > mon.x &&
        player.x + 6 < mon.x + mon.w &&
        player.y + player.h > mon.y &&
        player.y < mon.y + mon.h) {
      if (player.vy > 0 && player.y + player.h - player.vy <= mon.y + 14) {
        mon.alive = false;
        player.vy = -9;
      } else if (player.invincible === 0) {
        player.lives--;
        player.invincible = 60;
        sfxHurt();
        updateHUD();
        if (player.lives <= 0) {
          gameOver = true;
          stopBGM();
          document.getElementById("overlay-title").textContent = "💫 差一點點！";
          document.getElementById("overlay-msg").textContent = "再幫芮恩公主挑戰一次吧！";
          document.getElementById("overlay").style.display = "flex";
        }
      }
    }
  });

  if (player.x + player.w > castle.x + 30) {
    gameWon = true;
    sfxWin();
    spawnFirework(castle.x + 60, castle.y - 40);
    document.getElementById("overlay-title").textContent = "🎂 芮恩公主 12歲生日快樂！🎆";
    document.getElementById("overlay-msg").textContent = `成功抵達大城堡！共收集 ${player.stars} 顆星星 ⭐`;
    document.getElementById("overlay").style.display = "flex";
  }

  cameraX = Math.max(0, Math.min(player.x - canvas.width * 0.3, WORLD_WIDTH - canvas.width));
}

function draw() {
  const groundY = canvas.height - 50;

  ctx.fillStyle = "#87CEEB";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(-cameraX, 0);

  ctx.font = "36px serif";
  for (let cx = 120; cx < WORLD_WIDTH; cx += 360) {
    ctx.fillText("☁️", cx, 70);
  }

  ctx.fillStyle = "#4cd137";
  ctx.fillRect(0, groundY, WORLD_WIDTH, 14);
  ctx.fillStyle = "#8c6239";
  ctx.fillRect(0, groundY + 14, WORLD_WIDTH, 36);

  blocks.forEach(b => {
    ctx.fillStyle = b.hit ? "#95a5a6" : "#f39c12";
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 22px sans-serif";
    ctx.fillText(b.hit ? "✓" : "?", b.x + 14, b.y + 29);
  });

  ctx.font = "30px serif";
  stars.forEach(s => {
    if (!s.collected) {
      ctx.fillText("⭐", s.x, s.y + 26);
    }
  });

  ctx.font = "34px serif";
  monsters.forEach(mon => {
    if (mon.alive) {
      ctx.fillText("👾", mon.x, mon.y + 32);
    }
  });

  ctx.font = "24px serif";
  magics.forEach(m => {
    ctx.fillText("✨", m.x, m.y + 8);
  });

  ctx.font = "110px serif";
  ctx.fillText("🏰", castle.x, groundY - 4);
  ctx.font = "54px serif";
  ctx.fillText("🎂", castle.x + 125, groundY - 2);

  if (player.invincible % 10 < 6) {
    ctx.font = "40px serif";
    ctx.fillText("👸", player.x, player.y + 38);
  }

  fireworks.forEach(p => {
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

resetGame();
loop();
</script>
</body>
</html>
