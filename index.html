<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🐰 芮恩公主 12歲生日大冒險</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #top-bar {
      width: 100%;
      height: 54px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    #title-box {
      font-size: 15px;
      font-weight: bold;
      color: #d63384;
    }
    #status-box {
      font-size: 15px;
      font-weight: bold;
      color: #222;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #sound-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #d63384;
      background: #fff0f6;
      font-size: 16px;
      padding: 0;
    }
    #game-wrap {
      position: relative;
      width: 100%;
      height: calc(100vh - 174px);
      background: #87CEEB;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #control-bar {
      width: 100%;
      height: 120px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
    }
    .pad-group {
      display: flex;
      gap: 12px;
    }
    .big-btn {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      font-size: 34px;
      font-weight: bold;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #btn-left, #btn-right {
      background: #2563eb;
      box-shadow: 0 5px 0 #1e3a8a;
    }
    #btn-magic {
      background: #9333ea;
      box-shadow: 0 5px 0 #581c87;
    }
    #btn-jump {
      width: 92px;
      height: 92px;
      font-size: 38px;
      background: #dc2626;
      box-shadow: 0 5px 0 #7f1d1d;
    }
    .big-btn:active, .big-btn.pressed {
      transform: translateY(4px);
      opacity: 0.9;
    }
    #win-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 20px;
    }
    #win-screen h2 {
      font-size: 28px;
      color: #ffd700;
      margin: 0 0 10px;
    }
    #win-screen p {
      font-size: 18px;
      margin: 0 0 20px;
    }
    #replay-btn {
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      background: #ff69b4;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <div id="title-box">🐰 芮恩公主生日大冒險</div>
    <div id="status-box">
      <span id="hp-text">❤️❤️❤️</span>
      <span id="star-text">⭐ 0/6</span>
      <button id="sound-btn">🔊</button>
    </div>
  </div>

  <div id="game-wrap">
    <canvas id="gameCanvas" width="360" height="420"></canvas>
    <div id="win-screen">
      <h2 id="end-title">🎂 芮恩公主 12歲生日快樂！🎆</h2>
      <p id="end-msg">小兔子成功抵達城堡！</p>
      <button id="replay-btn" onclick="initGame()">再玩一次 🎉</button>
    </div>
  </div>

  <div id="control-bar">
    <div class="pad-group">
      <button class="big-btn" id="btn-left">◀</button>
      <button class="big-btn" id="btn-right">▶</button>
    </div>
    <div class="pad-group">
      <button class="big-btn" id="btn-magic">✨</button>
      <button class="big-btn" id="btn-jump">⬆</button>
    </div>
  </div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  function fitCanvas() {
    const wrap = document.getElementById("game-wrap");
    canvas.width = wrap.clientWidth || window.innerWidth || 360;
    canvas.height = wrap.clientHeight || 420;
  }
  fitCanvas();
  window.addEventListener("resize", fitCanvas);

  // ================= 音效系統 =================
  let audioCtx = null;
  let soundOn = true;
  let bgmInterval = null;
  let step = 0;
  let startedMusic = false;

  const happyBGM = [523, 659, 784, 659, 587, 784, 880, 784, 659, 784, 1046, 784, 698, 880, 784, 659];
  const clearBGM = [523, 659, 784, 1046, 784, 1046, 1175, 1319, 1046, 784, 659, 784, 1046, 0, 1046, 0];

  function startAudio() {
    if (!soundOn) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
      if (!startedMusic) {
        startedMusic = true;
        playLoopBGM(false);
      }
    } catch (e) {}
  }

  function beep(freq, time, type, vol, delay) {
    if (!soundOn || !audioCtx || !freq) return;
    try {
      const now = audioCtx.currentTime + (delay || 0);
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type || "triangle";
      osc.frequency.setValueAtTime(freq, now);
      g.gain.setValueAtTime(0.001, now);
      g.gain.exponentialRampToValueAtTime(vol || 0.1, now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, now + time);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + time + 0.02);
    } catch (e) {}
  }

  function playLoopBGM(isWin) {
    if (bgmInterval) clearInterval(bgmInterval);
    step = 0;
    bgmInterval = setInterval(function () {
      if (!soundOn || !audioCtx || audioCtx.state !== "running") return;
      const list = isWin ? clearBGM : happyBGM;
      const f = list[step % list.length];
      if (f > 0) beep(f, 0.15, isWin ? "sine" : "triangle", 0.06, 0);
      step++;
    }, isWin ? 185 : 210);
  }

  // 頂磚塊掉出星星的音效
  function soundBlockPop() {
    startAudio();
    beep(587, 0.08, "sine", 0.14, 0);
    beep(880, 0.12, "sine", 0.14, 0.06);
  }

  // 吃到星星音效
  function soundEatStar() {
    startAudio();
    beep(988, 0.09, "sine", 0.16, 0);
    beep(1319, 0.2, "sine", 0.16, 0.08);
  }

  // 魔法射擊音效
  function soundShoot() {
    startAudio();
    beep(900, 0.07, "sine", 0.13, 0);
    beep(1400, 0.1, "sine", 0.13, 0.05);
  }

  // 被怪獸撞到音效
  function soundHit() {
    startAudio();
    beep(300, 0.14, "sawtooth", 0.13, 0);
    beep(180, 0.22, "sawtooth", 0.13, 0.12);
  }

  document.getElementById("sound-btn").onclick = function () {
    soundOn = !soundOn;
    this.textContent = soundOn ? "🔊" : "🔇";
    if (soundOn) {
      startedMusic = false;
      startAudio();
    } else if (bgmInterval) {
      clearInterval(bgmInterval);
    }
  };

  // ================= 遊戲核心 =================
  const WORLD_W = 2200;
  let camX = 0;
  let isOver = false;
  let isWin = false;
  const input = { left: false, right: false };

  let rabbit, blocks, fallingStars, monsters, bullets, fireworks, castleX;

  function initGame() {
    fitCanvas();
    const groundY = canvas.height - 55;
    document.getElementById("win-screen").style.display = "none";
    isOver = false;
    isWin = false;
    camX = 0;

    // 主角：可愛小兔子
    rabbit = {
      x: 50,
      y: groundY - 42,
      w: 40,
      h: 42,
      vx: 0,
      vy: 0,
      speed: 4.5,
      jumpPower: -13.5, // 跳得夠高，輕鬆頂方塊
      onGround: true,
      dir: 1,
      hp: 3,
      stars: 0,
      hurtTimer: 0
    };

    // 6 個問號方塊（頂撞後會掉出星星）
    blocks = [
      { x: 210, y: groundY - 115, w: 46, h: 46, used: false },
      { x: 470, y: groundY - 115, w: 46, h: 46, used: false },
      { x: 760, y: groundY - 120, w: 46, h: 46, used: false },
      { x: 1080, y: groundY - 115, w: 46, h: 46, used: false },
      { x: 1380, y: groundY - 120, w: 46, h: 46, used: false },
      { x: 1660, y: groundY - 115, w: 46, h: 46, used: false }
    ];

    fallingStars = [];

    // 巡邏小怪獸
    monsters = [
      { x: 380, y: groundY - 38, w: 38, h: 38, vx: -1.4, minX: 290, maxX: 520, alive: true },
      { x: 920, y: groundY - 38, w: 38, h: 38, vx: -1.7, minX: 810, maxX: 1040, alive: true },
      { x: 1520, y: groundY - 38, w: 38, h: 38, vx: -1.9, minX: 1410, maxX: 1640, alive: true }
    ];

    bullets = [];
    fireworks = [];
    castleX = 1920;

    refreshUI();
    if (startedMusic && soundOn) playLoopBGM(false);
  }

  function refreshUI() {
    document.getElementById("hp-text").textContent = "❤️".repeat(Math.max(0, rabbit.hp)) || "💔";
    document.getElementById("star-text").textContent = "⭐ " + rabbit.stars + "/6";
  }

  function jumpAction() {
    startAudio();
    if (isOver || isWin) return;
    if (rabbit.onGround) {
      rabbit.vy = rabbit.jumpPower;
      rabbit.onGround = false;
    }
  }

  function shootAction() {
    startAudio();
    if (isOver || isWin) return;
    soundShoot();
    bullets.push({
      x: rabbit.dir === 1 ? rabbit.x + rabbit.w : rabbit.x - 16,
      y: rabbit.y + 16,
      vx: rabbit.dir * 8,
      life: 55
    });
  }

  function setHold(id, side) {
    const btn = document.getElementById(id);
    const start = (e) => {
      e.preventDefault();
      startAudio();
      input[side] = true;
      btn.classList.add("pressed");
    };
    const end = (e) => {
      e.preventDefault();
      input[side] = false;
      btn.classList.remove("pressed");
    };
    btn.addEventListener("touchstart", start, { passive: false });
    btn.addEventListener("touchend", end, { passive: false });
    btn.addEventListener("touchcancel", end, { passive: false });
    btn.addEventListener("mousedown", start);
    btn.addEventListener("mouseup", end);
    btn.addEventListener("mouseleave", end);
  }

  function setTap(id, fn) {
    const btn = document.getElementById(id);
    const press = (e) => {
      e.preventDefault();
      btn.classList.add("pressed");
      fn();
    };
    const release = (e) => {
      e.preventDefault();
      btn.classList.remove("pressed");
    };
    btn.addEventListener("touchstart", press, { passive: false });
    btn.addEventListener("touchend", release, { passive: false });
    btn.addEventListener("touchcancel", release, { passive: false });
    btn.addEventListener("mousedown", press);
    btn.addEventListener("mouseup", release);
  }

  setHold("btn-left", "left");
  setHold("btn-right", "right");
  setTap("btn-jump", jumpAction);
  setTap("btn-magic", shootAction);

  function addFirework(x, y) {
    const colors = ["#ff4757", "#ffa502", "#2ed573", "#1e90ff", "#ffd700", "#ff6b81"];
    for (let i = 0; i < 24; i++) {
      const a = (Math.PI * 2 * i) / 24;
      const s = 2 + Math.random() * 3.5;
      fireworks.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        color: colors[i % colors.length],
        alpha: 1
      });
    }
  }

  function update() {
    const groundY = canvas.height - 55;

    if (isWin) {
      if (Math.random() < 0.08) {
        addFirework(camX + 60 + Math.random() * (canvas.width - 120), 60 + Math.random() * 140);
      }
      fireworks.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.06;
        p.alpha -= 0.015;
      });
      fireworks = fireworks.filter(p => p.alpha > 0);
      return;
    }

    if (isOver) return;

    // 左右移動
    if (input.left) {
      rabbit.vx = -rabbit.speed;
      rabbit.dir = -1;
    } else if (input.right) {
      rabbit.vx = rabbit.speed;
      rabbit.dir = 1;
    } else {
      rabbit.vx = 0;
    }

    rabbit.x += rabbit.vx;
    if (rabbit.x < 0) rabbit.x = 0;
    if (rabbit.x > WORLD_W - rabbit.w) rabbit.x = WORLD_W - rabbit.w;

    // 重力與跳躍
    rabbit.vy += 0.62;
    rabbit.y += rabbit.vy;

    if (rabbit.y + rabbit.h >= groundY) {
      rabbit.y = groundY - rabbit.h;
      rabbit.vy = 0;
      rabbit.onGround = true;
    }

    // 頂問號方塊 -> 星星跳出來並自己掉下來
    blocks.forEach(b => {
      if (
        rabbit.x + rabbit.w > b.x &&
        rabbit.x < b.x + b.w &&
        rabbit.y <= b.y + b.h &&
        rabbit.y >= b.y &&
        rabbit.vy < 0
      ) {
        rabbit.vy = 2;
        if (!b.used) {
          b.used = true;
          soundBlockPop();
          fallingStars.push({
            x: b.x + 8,
            y: b.y - 34,
            vy: -4.5, // 先往上彈一點，再自動掉下來
            collected: false
          });
        }
      }
    });

    // 星星自動掉落到地面 + 吃星星判定
    fallingStars.forEach(s => {
      if (s.collected) return;
      s.vy += 0.35;
      s.y += s.vy;
      if (s.y >= groundY - 32) {
        s.y = groundY - 32;
        s.vy = 0;
      }

      if (
        rabbit.x < s.x + 32 &&
        rabbit.x + rabbit.w > s.x &&
        rabbit.y < s.y + 32 &&
        rabbit.y + rabbit.h > s.y
      ) {
        s.collected = true;
        rabbit.stars++;
        soundEatStar();
        refreshUI();
      }
    });

    // 魔法攻擊
    bullets.forEach(m => {
      m.x += m.vx;
      m.life--;
      monsters.forEach(mon => {
        if (mon.alive && m.x > mon.x && m.x < mon.x + mon.w && m.y > mon.y && m.y < mon.y + mon.h) {
          mon.alive = false;
          m.life = 0;
        }
      });
    });
    bullets = bullets.filter(m => m.life > 0);

    // 怪獸移動與碰撞
    if (rabbit.hurtTimer > 0) rabbit.hurtTimer--;
    monsters.forEach(mon => {
      if (!mon.alive) return;
      mon.x += mon.vx;
      if (mon.x <= mon.minX || mon.x >= mon.maxX) mon.vx *= -1;

      if (
        rabbit.x + rabbit.w - 6 > mon.x &&
        rabbit.x + 6 < mon.x + mon.w &&
        rabbit.y + rabbit.h > mon.y &&
        rabbit.y < mon.y + mon.h
      ) {
        if (rabbit.vy > 0 && rabbit.y + rabbit.h - rabbit.vy <= mon.y + 16) {
          mon.alive = false;
          rabbit.vy = -10;
        } else if (rabbit.hurtTimer === 0) {
          rabbit.hp--;
          rabbit.hurtTimer = 60;
          soundHit();
          refreshUI();
          if (rabbit.hp <= 0) {
            isOver = true;
            if (bgmInterval) clearInterval(bgmInterval);
            document.getElementById("end-title").textContent = "💫 再試一次吧！";
            document.getElementById("end-msg").textContent = "幫小兔子重新挑戰！";
            document.getElementById("win-screen").style.display = "flex";
          }
        }
      }
    });

    // 到達終點城堡
    if (rabbit.x + rabbit.w > castleX + 20) {
      isWin = true;
      if (soundOn) playLoopBGM(true);
      addFirework(castleX + 50, groundY - 150);
      document.getElementById("end-title").textContent = "🎂 芮恩公主 12歲生日快樂！🎆";
      document.getElementById("end-msg").textContent = "小兔子抵達城堡啦！共收集 " + rabbit.stars + " / 6 顆星星 ⭐";
      document.getElementById("win-screen").style.display = "flex";
    }

    camX = Math.max(0, Math.min(rabbit.x - canvas.width * 0.25, WORLD_W - canvas.width));
  }

  function draw() {
    const groundY = canvas.height - 55;

    // 藍天
    ctx.fillStyle = "#87CEEB";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-camX, 0);

    // 白雲
    ctx.font = "34px sans-serif";
    for (let cx = 80; cx < WORLD_W; cx += 320) {
      ctx.fillText("☁️", cx, 62);
    }

    // 草地與泥土
    ctx.fillStyle = "#4cd137";
    ctx.fillRect(0, groundY, WORLD_W, 15);
    ctx.fillStyle = "#8c6239";
    ctx.fillRect(0, groundY + 15, WORLD_W, 40);

    // 問號方塊
    blocks.forEach(b => {
      ctx.fillStyle = b.used ? "#95a5a6" : "#f39c12";
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3;
      ctx.strokeRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 24px sans-serif";
      ctx.fillText(b.used ? "✓" : "?", b.x + 15, b.y + 32);
    });

    // 掉下來的星星
    ctx.font = "30px sans-serif";
    fallingStars.forEach(s => {
      if (!s.collected) {
        ctx.fillText("⭐", s.x, s.y + 28);
      }
    });

    // 怪獸
    ctx.font = "34px sans-serif";
    monsters.forEach(mon => {
      if (mon.alive) {
        ctx.fillText("👾", mon.x, mon.y + 32);
      }
    });

    // 魔法光球
    ctx.font = "24px sans-serif";
    bullets.forEach(m => {
      ctx.fillText("✨", m.x, m.y + 8);
    });

    // 終點城堡 + 蛋糕 + 生日快樂字樣
    ctx.font = "96px sans-serif";
    ctx.fillText("🏰", castleX, groundY - 4);
    ctx.font = "48px sans-serif";
    ctx.fillText("🎂", castleX + 108, groundY - 2);
    ctx.fillStyle = "#d63384";
    ctx.font = "bold 22px sans-serif";
    ctx.fillText("🎉 生日快樂 🎉", castleX - 5, groundY - 115);

    // 主角小兔子
    if (rabbit.hurtTimer % 10 < 6) {
      ctx.font = "38px sans-serif";
      ctx.fillText("🐰", rabbit.x, rabbit.y + 36);
    }

    // 煙花
    fireworks.forEach(p => {
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  initGame();
  draw();

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }
  requestAnimationFrame(gameLoop);
</script>
</body>
</html>
